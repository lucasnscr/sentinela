groups:
  - name: sentinela-catalog-api
    rules:
      - record: sentinela_service_requests_per_minute
        expr: sum by (service, environment) (rate(http_server_requests_seconds_count{service="catalog-api",uri!~"/actuator.*"}[1m])) * 60
      - record: sentinela_service_error_ratio
        expr: >-
          (
            sum by (service, environment) (rate(http_server_requests_seconds_count{service="catalog-api",status=~"5..",uri!~"/actuator.*"}[1m]))
            or on (service, environment)
            (sum by (service, environment) (rate(http_server_requests_seconds_count{service="catalog-api",uri!~"/actuator.*"}[1m])) * 0)
          )
          / clamp_min(sum by (service, environment) (rate(http_server_requests_seconds_count{service="catalog-api",uri!~"/actuator.*"}[1m])), 1e-9)
      - record: sentinela_service_latency_p95_ms
        expr: histogram_quantile(0.95, sum by (le, service, environment) (rate(http_server_requests_seconds_bucket{service="catalog-api",uri!~"/actuator.*"}[1m]))) * 1000
      - record: sentinela_service_saturation_ratio
        expr: max by (service, environment) (hikaricp_connections_active{service="catalog-api"} / clamp_min(hikaricp_connections_max{service="catalog-api"}, 1))
      - record: sentinela_service_observed_at_seconds
        expr: max by (service, environment) (timestamp(http_server_requests_seconds_count{service="catalog-api",uri!~"/actuator.*"}) and on (job, instance) (up == 1))
