name: AI implementation
run-name: 'AI implementation • issue #${{ github.event.issue.number || inputs.issue }}'
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Authorized open issue number
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: local-ai-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
jobs:
  implementation:
    if: vars.AI_ENABLED == 'true' && vars.LOCAL_AI_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.comment.user.type == 'User')
    uses: lucasnscr/issue-to-pr-ai/.github/workflows/ollama-reusable.yml@42f22ec8e8c0e6f51f82ddb189e5203b35a5d94c
    with:
      engine_sha: 42f22ec8e8c0e6f51f82ddb189e5203b35a5d94c
      publish_mode: local
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
